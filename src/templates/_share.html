<button class="btn btn-secondary btn-icon btn-sm" type="button" data-copy aria-label="Copy link" title="Copy link">{{ icon('link-simple') }}</button>
<a class="btn btn-secondary btn-icon btn-sm" data-share-net="linkedin" href="https://www.linkedin.com/sharing/share-offsite/?url={{ share | urlencode }}" target="_blank" rel="noopener" aria-label="Share on LinkedIn" title="LinkedIn">{{ icon('linkedin-logo') }}</a>
<a class="btn btn-secondary btn-icon btn-sm" data-share-net="x" href="https://x.com/intent/post?url={{ share | urlencode }}" target="_blank" rel="noopener" aria-label="Share on X" title="X">{{ icon('x-logo') }}</a>
<a class="btn btn-secondary btn-icon btn-sm" data-share-net="facebook" href="https://www.facebook.com/sharer/sharer.php?u={{ share | urlencode }}" target="_blank" rel="noopener" aria-label="Share on Facebook" title="Facebook">{{ icon('facebook-logo') }}</a>
<a class="btn btn-secondary btn-icon btn-sm" data-share-net="mail" href="mailto:?subject={{ post.title | urlencode }}&body={{ share | urlencode }}" aria-label="Share by e-mail" title="E-mail">{{ icon('envelope-simple') }}</a>
<button class="btn btn-secondary btn-icon btn-sm" type="button" data-share aria-label="Share…" title="Share…">{{ icon('share-network') }}</button>
